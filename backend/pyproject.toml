[project]
name = "deployments-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141.1",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "uvicorn[standard]>=0.52.4",
  "pymongo>=4.18.0",
  "itsdangerous>=2.2.0",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "httpx>=0.28.1",
  "asgi-lifespan>=2.1.0",
  "time-machine>=3.5.0",
  "faker>=40.38.0",
  "ruff>=0.16.6",
  "mypy>=2.3.1",
  "pyright>=1.1.411",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
usefixtures = ["disable_dotenv"]
addopts = "-ra -m 'not ttl'"
markers = [
  "ttl: actual MongoDB TTL cleanup (up to 90 seconds)",
  "http: network integration tests against TEST_API_URL",
]

[tool.ruff]
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["ALL"]
# Do not manufacture docstrings/copyright claims; Ruff format owns trailing commas.
ignore = [
  "undocumented-public-module",
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-public-package",
  "undocumented-magic-method",
  "undocumented-public-nested-class",
  "undocumented-public-init",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "missing-copyright-notice",
  "missing-trailing-comma",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Assertions and literal expected values are test specifications; mocks wrap dynamic APIs.
"tests/*" = ["any-type", "assert", "magic-value-comparison"]
# Isolated, deterministic test signing secret.
"tests/conftest.py" = ["hardcoded-password-string"]
"app/init_db.py" = ["print"]  # Explicit preparation command reports completion.
# Standalone synthetic-data CLI.
"../seed/seed.py" = [
  "suspicious-non-cryptographic-random-usage",
  "print",
  "implicit-namespace-package",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
  "app",
  "tests",
  "../seed/seed.py",
]
warn_unreachable = true
warn_incomplete_stub = true
disallow_any_unimported = true
disallow_any_decorated = true
strict_equality_for_none = true
strict_bytes = true
enable_error_code = [
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "ignore-without-code",
  "unused-awaitable",
  "explicit-override",
  "mutable-override",
  "unimported-reveal",
  "deprecated",
  "exhaustive-match",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
include = ["app", "tests", "../seed/seed.py"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportDeprecated = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
